name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - shell: pwsh
        run: ./scripts/bootstrap.ps1
      - shell: pwsh
        run: ./gradlew.bat build runtimeProbeJar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: python scripts/generate-masonry.py --check --jar build/libs/geologic-variation-0.2.2-dev.jar
      - shell: pwsh
        run: python scripts/check-geology-library.py
      - shell: pwsh
        run: python -m py_compile scripts/runtime-acceptance.py scripts/compare-runtime-chunks.py scripts/audit-host-feature-rules.py scripts/verify-ore-hosts.py scripts/summarize-host-acceptance.py scripts/trace-natural-coal.py scripts/summarize-natural-coal.py scripts/verify-context-startup.py scripts/summarize-context-startup.py scripts/verify-live-context.py scripts/summarize-live-context.py scripts/verify-hot-config.py scripts/summarize-hot-config.py scripts/verify-td-artifact.py scripts/summarize-td-artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: geologic-variation-dev
          path: build/libs/*.jar
