name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - shell: pwsh
        run: ./scripts/bootstrap.ps1
      - shell: pwsh
        run: ./gradlew.bat build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: python scripts/generate-masonry.py --check --jar build/libs/geologic-variation-0.2.0-dev.jar
      - shell: pwsh
        run: python scripts/check-geology-library.py
      - uses: actions/upload-artifact@v4
        with:
          name: geologic-variation-dev
          path: build/libs/*.jar
