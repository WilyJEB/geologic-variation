name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - shell: pwsh
        run: ./scripts/bootstrap.ps1
      - shell: pwsh
        run: ./gradlew.bat build runtimeProbeJar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: python scripts/generate-masonry.py --check --jar build/libs/geologic-variation-0.2.2-dev.jar
      - shell: pwsh
        run: python scripts/check-geology-library.py
      - shell: pwsh
        run: python -m py_compile scripts/runtime-acceptance.py scripts/compare-runtime-chunks.py scripts/audit-host-feature-rules.py scripts/verify-ore-hosts.py scripts/summarize-host-acceptance.py scripts/trace-natural-coal.py scripts/summarize-natural-coal.py scripts/verify-context-startup.py scripts/summarize-context-startup.py scripts/verify-live-context.py scripts/summarize-live-context.py scripts/verify-hot-config.py scripts/summarize-hot-config.py scripts/verify-td-artifact.py scripts/summarize-td-artifact.py scripts/verify-model-config.py scripts/summarize-model-config.py
      - shell: pwsh
        run: python -m py_compile scripts/inspect-backend-feasibility.py scripts/summarize-backend-feasibility.py
      - shell: pwsh
        run: python -m py_compile scripts/prepare-directml-java.py scripts/verify-backend.py scripts/summarize-backend.py
      - shell: pwsh
        run: python -m py_compile scripts/launch-acceptance-client.py scripts/verify-integrated-lifecycle.py scripts/summarize-integrated-lifecycle.py
      - shell: pwsh
        run: python -m py_compile scripts/verify-anchor-performance.py scripts/summarize-anchor-performance.py
      - shell: pwsh
        run: python -m py_compile scripts/verify-coarse-prototype.py scripts/verify-coarse-cold.py scripts/summarize-coarse-prototype.py
      - shell: pwsh
        run: python -m py_compile scripts/verify-terrain-diagnostics.py scripts/summarize-terrain-diagnostics.py
      - shell: pwsh
        run: python scripts/test-terrain-diagnostics.py
      - shell: pwsh
        run: python -m py_compile scripts/verify-sampling-support.py scripts/summarize-sampling-support.py
      - shell: pwsh
        run: python scripts/test-sampling-support.py
      - shell: pwsh
        run: python scripts/test-td-landforms.py
      - shell: pwsh
        run: python scripts/test-td-tracking.py
      - shell: pwsh
        run: python scripts/test-td-tracking-controls.py
      - shell: pwsh
        run: python scripts/test-negative-td-tracking.py
      - shell: pwsh
        run: python scripts/test-td-geometry-numerics.py
      - shell: pwsh
        run: python scripts/test-td-axis-identical.py
      - uses: actions/upload-artifact@v4
        with:
          name: geologic-variation-dev
          path: build/libs/*.jar
