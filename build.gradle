plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
group = 'dev.wilyjeb.geology'
version = '0.2.1-dev'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.251'
    mods { geologic_variation { sourceSet sourceSets.main } }
    runs {
        client { client(); gameDirectory = file('runs/client') }
        server { server(); gameDirectory = file('runs/server'); programArguments.add('--nogui') }
    }
}
dependencies { implementation files('libs/terrain-diffusion-standalone.jar') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { archiveBaseName = 'geologic-variation'; preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.register('testGeology', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.wilyjeb.geology.domain.GeologyTests'
}
tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.register('testSettings', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.wilyjeb.geology.domain.SettingsTests'
}

tasks.named('check') { dependsOn testGeology, testSettings }
